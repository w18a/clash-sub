<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Tokyo Node</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px 14px 40px;background:#0b0f14;color:#e6edf3;
font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.2px}
.ts{font-size:11px;color:#6b7785;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:10px}
.card{background:#131a22;border:1px solid #1e2733;border-radius:12px;padding:13px 14px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;align-items:center;gap:8px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#3a4652;flex:0 0 8px}
.ok .dot{background:#3fb950;box-shadow:0 0 8px #3fb95088}
.bad .dot{background:#f85149;box-shadow:0 0 8px #f8514988}
.bad{color:#f85149}
.lb{display:flex;justify-content:space-between;font-size:12px;color:#8b949e;margin-bottom:5px}
.lb b{color:#e6edf3;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:7px;background:#1e2733;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s ease}
.m i{background:linear-gradient(90deg,#1f6feb,#58a6ff)}
.d i{background:linear-gradient(90deg,#238636,#3fb950)}
.m.warn i{background:linear-gradient(90deg,#9e6a03,#d29922)}
.m.crit i,.d.crit i{background:linear-gradient(90deg,#8e1519,#f85149)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:#8b949e}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#58a6ff}
.st{font-size:11px;color:#6b7785;text-align:center;margin-top:16px}
.err{color:#f85149;font-size:12px;text-align:center;padding:8px}
</style></head><body>
<div class="hd"><h1>Tokyo Node</h1><div class="ts" id="ts">--</div></div>
<div class="grid">
  <div class="card"><div class="svc" id="svc"></div></div>
  <div class="card">
    <div class="lb"><span>内存</span><b id="memtx">--</b></div>
    <div class="bar m" id="membar"><i style="width:0"></i></div>
  </div>
  <div class="card">
    <div class="lb"><span>磁盘</span><b id="disktx">--</b></div>
    <div class="bar d" id="diskbar"><i style="width:0"></i></div>
  </div>
  <div class="card"><div class="kv" id="kv"></div></div>
</div>
<div class="st" id="st">加载中…</div>
<script>
const SRC='https://raw.githubusercontent.com/w18a/clash-sub/status/status.json?t=';
const $=id=>document.getElementById(id);
function up(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
 return d>0?d+'天'+h+'时':h>0?h+'时'+m+'分':m+'分'}
function bar(el,p){
 const w=Math.max(0,Math.min(100,p));el.querySelector('i').style.width=w+'%';
 el.classList.toggle('warn',p>=70&&p<85);el.classList.toggle('crit',p>=85);}
function svc(id,ok){return '<div class="item '+(ok?'ok':'bad')+'"><i class="dot"></i>'+id+'</div>'}
async function load(){
 try{
  const r=await fetch(SRC+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  const a=v=>v==='active';
  $('svc').innerHTML=svc('Xray',a(d.xray))+svc('Cloudflare',a(d.cfnode))
    +svc('订阅同步',a(d.subsync))+svc('自动清理',a(d.srvclean));
  $('membar').parentElement;
  bar($('membar'),d.mem_pct);$('memtx').textContent=d.mem_used+' / '+d.mem_total+' MB ('+d.mem_pct+'%)';
  bar($('diskbar'),d.disk_pct);$('disktx').textContent=(d.disk_used/1024).toFixed(1)+' / '+(d.disk_total/1024).toFixed(0)+' GB ('+d.disk_pct+'%)';
  $('kv').innerHTML=[['负载',d.load],['运行时间',up(d.uptime)],['进程',d.procs],
   ['连接数',d.conns],['拥塞控制',d.bbr],['隧道重启',d.cf_restarts+' 次'],
   ['已封禁 IP',d.banned],['最近推送',(d.last_push||'--').replace('T',' ').replace('Z',' UTC')],
   ['隧道域名','<span class="mono">'+(d.domain||'--')+'</span>']]
   .map(([k,v])=>'<span>'+k+'</span><span>'+v+'</span>').join('');
  const dd=new Date(d.ts);
  $('ts').textContent=d.host;
  $('st').textContent='数据时间 '+dd.toLocaleString('zh-CN',{hour12:false});
 }catch(e){$('st').innerHTML='<span class="err">拉取失败：'+e.message+'（30 秒后重试）</span>';}
}
load();setInterval(load,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
