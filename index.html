<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Tokyo Nodes</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px 14px 40px;background:#0b0f14;color:#e6edf3;
font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font-size:19px;margin:0;font-weight:600}
.ts{font-size:11px;color:#6b7785}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tab{flex:0 0 auto;padding:7px 15px;border-radius:9px;background:#131a22;border:1px solid #1e2733;
font-size:13px;color:#8b949e;white-space:nowrap;cursor:pointer;transition:.15s}
.tab.on{background:#1f6feb22;border-color:#1f6feb;color:#58a6ff;font-weight:600}
.tab .n{display:block;font-size:10px;color:#6b7785;margin-top:1px}
.tab.on .n{color:#58a6ffaa}
.grid{display:grid;gap:10px}
.card{background:#131a22;border:1px solid #1e2733;border-radius:12px;padding:13px 14px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;align-items:center;gap:8px;font-size:13px;color:#8b949e}
.dot{width:8px;height:8px;border-radius:50%;background:#3a4652;flex:0 0 8px}
.ok{color:#e6edf3}.ok .dot{background:#3fb950;box-shadow:0 0 8px #3fb95088}
.bad{color:#f85149}.bad .dot{background:#f85149;box-shadow:0 0 8px #f8514988}
.off{color:#6b7785}.off .dot{background:#30363d}
.lb{display:flex;justify-content:space-between;font-size:12px;color:#8b949e;margin-bottom:5px}
.lb b{color:#e6edf3;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:7px;background:#1e2733;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s ease;width:0}
.m i{background:linear-gradient(90deg,#1f6feb,#58a6ff)}
.d i{background:linear-gradient(90deg,#238636,#3fb950)}
.warn i{background:linear-gradient(90deg,#9e6a03,#d29922)}
.crit i{background:linear-gradient(90deg,#8e1519,#f85149)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:#8b949e}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#58a6ff}
.st{font-size:11px;color:#6b7785;text-align:center;margin-top:16px}
.err{color:#f85149;font-size:12px;text-align:center;padding:10px}
</style></head><body>
<div class="hd"><h1>Tokyo Nodes</h1><div class="ts" id="ts">--</div></div>
<div class="tabs" id="tabs"></div>
<div id="panel" class="grid"></div>
<div class="st" id="st">加载中…</div>
<script>
const BASE='https://raw.githubusercontent.com/w18a/clash-sub/status/';
const NODES=[
 {id:1,name:'东京 1号机',ip:'141.147.190.180',f:'status.json',main:true},
 {id:2,name:'东京 2号机',ip:'161.33.173.179',f:'status2.json',main:true}
];
const $=id=>document.getElementById(id);
let cur=1;
function up(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
 return d>0?d+'天'+h+'时':h>0?h+'时'+m+'分':m+'分'}
function svc(n,v,main){
 const a=v==='active';
 let cls=a?'ok':(main?'bad':'off');
 let txt=n+(a?'':' · '+(main?'异常':'未部署'));
 return '<div class="item '+cls+'"><i class="dot"></i>'+txt+'</div>'}
function bar(id,p){const el=$(id);const w=Math.max(0,Math.min(100,p||0));
 el.querySelector('i').style.width=w+'%';
 el.classList.remove('warn','crit');
 if(p>=85)el.classList.add('crit');else if(p>=70)el.classList.add('warn');}
async function get(f){const r=await fetch(BASE+f+'?t='+Date.now(),{cache:'no-store'});
 if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function render(){
 const n=NODES.find(x=>x.id===cur);
 try{
  const d=await get(n.f);
  $('panel').innerHTML=`
  <div class="card"><div class="svc">
   ${svc('Xray',d.xray,n.main)}${svc('Cloudflare',d.cfnode,n.main)}
   ${svc('订阅同步',d.subsync,n.main)}${svc('自动清理',d.srvclean,n.main)}
  </div></div>
  <div class="card"><div class="lb"><span>内存</span><b>${d.mem_used} / ${d.mem_total} MB (${d.mem_pct}%)</b></div>
   <div class="bar m" id="b1"><i></i></div></div>
  <div class="card"><div class="lb"><span>磁盘</span><b>${(d.disk_used/1024).toFixed(1)} / ${(d.disk_total/1024).toFixed(0)} GB (${d.disk_pct}%)</b></div>
   <div class="bar d" id="b2"><i></i></div></div>
  <div class="card"><div class="kv">
   <span>主机</span><span>${d.host} · ${n.ip}</span>
   <span>负载</span><span>${d.load}</span>
   <span>运行时间</span><span>${up(d.uptime)}</span>
   <span>进程 / 连接</span><span>${d.procs} / ${d.conns}</span>
   <span>拥塞控制</span><span>${d.bbr}</span>
   ${n.main?`<span>隧道重启</span><span>${d.cf_restarts} 次</span>
   <span>已封禁 IP</span><span>${d.banned}</span>
   <span>最近推送</span><span>${(d.last_push||'--').replace('T',' ').replace('Z',' UTC')}</span>
   <span>隧道域名</span><span class="mono">${d.domain||'--'}</span>`
   :`<span>节点角色</span><span>备用节点（独立隧道 · 无公网端口）</span>`}
  </div></div>`;
  bar('b1',d.mem_pct);bar('b2',d.disk_pct);
  const dd=new Date(d.ts);
  $('st').textContent='数据时间 '+dd.toLocaleString('zh-CN',{hour12:false})+' · 30 秒自动刷新';
 }catch(e){$('panel').innerHTML='<div class="card"><div class="err">'+n.name+' 拉取失败：'+e.message+'</div></div>';}
}
function drawTabs(){
 $('tabs').innerHTML=NODES.map(n=>
  `<div class="tab ${n.id===cur?'on':''}" data-id="${n.id}">${n.name}<span class="n">${n.ip}</span></div>`).join('');
 [...document.querySelectorAll('.tab')].forEach(t=>t.onclick=()=>{cur=+t.dataset.id;drawTabs();render();});
}
drawTabs();render();
setInterval(render,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
</script></body></html>
