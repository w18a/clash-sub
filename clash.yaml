mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

hosts:
  'kissing-miscellaneous-customs-appropriate.trycloudflare.com': 104.16.230.132

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'kissing-miscellaneous-customs-appropriate.trycloudflare.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query

proxies:
  - name: Tokyo-Tunnel
    type: vless
    server: kissing-miscellaneous-customs-appropriate.trycloudflare.com
    port: 443
    uuid: c2f24874-f9a7-4009-9983-de40767f212c
    network: ws
    tls: true
    udp: false
    servername: kissing-miscellaneous-customs-appropriate.trycloudflare.com
    client-fingerprint: chrome
    skip-cert-verify: false
    ws-opts:
      path: /ws
      headers:
        Host: kissing-miscellaneous-customs-appropriate.trycloudflare.com

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - Tokyo-Tunnel
      - DIRECT

