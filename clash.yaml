mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090

hosts:
  'integrating-fridge-serving-wish.trycloudflare.com': 104.16.231.132
  'mold-fought-process-creation.trycloudflare.com': 104.16.230.132

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'integrating-fridge-serving-wish.trycloudflare.com'
    - 'mold-fought-process-creation.trycloudflare.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query

rule-providers:
  adblock:
    type: http
    behavior: domain
    format: text
    url: 'https://gh-proxy.com/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list'
    path: ./ruleset/adblock.list
    interval: 86400
  adblock2:
    type: http
    behavior: domain
    format: text
    url: 'https://gh-proxy.com/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list'
    path: ./ruleset/adblock2.list
    interval: 86400
  chinadomain:
    type: http
    behavior: domain
    format: text
    url: 'https://gh-proxy.com/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list'
    path: ./ruleset/chinadomain.list
    interval: 86400
  lan:
    type: http
    behavior: classical
    format: text
    url: 'https://gh-proxy.com/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list'
    path: ./ruleset/lan.list
    interval: 86400

proxies:
  - name: Tokyo-Tunnel
    type: vless
    server: integrating-fridge-serving-wish.trycloudflare.com
    port: 443
    uuid: c2f24874-f9a7-4009-9983-de40767f212c
    network: ws
    tls: true
    udp: false
    servername: integrating-fridge-serving-wish.trycloudflare.com
    client-fingerprint: chrome
    skip-cert-verify: false
    ws-opts:
      path: /ws
      headers:
        Host: integrating-fridge-serving-wish.trycloudflare.com

  - name: Tokyo-2
    type: vless
    server: mold-fought-process-creation.trycloudflare.com
    port: 443
    uuid: 58581eef-b947-4781-98b2-7b8d81ff9e7a
    network: ws
    tls: true
    udp: false
    servername: mold-fought-process-creation.trycloudflare.com
    client-fingerprint: chrome
    skip-cert-verify: false
    ws-opts:
      path: /n2ws
      headers:
        Host: mold-fought-process-creation.trycloudflare.com

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - AUTO
      - Tokyo-Tunnel
      - Tokyo-2
      - DIRECT
  - name: AUTO
    type: url-test
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
    proxies:
      - Tokyo-Tunnel
      - Tokyo-2
  - name: ADBLOCK
    type: select
    proxies:
      - REJECT
      - DIRECT
      - PROXY

rules:
  - RULE-SET,lan,DIRECT
  - RULE-SET,adblock,ADBLOCK
  - RULE-SET,adblock2,ADBLOCK
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - DOMAIN-SUFFIX,google.com,PROXY
  - DOMAIN-SUFFIX,googleapis.com,PROXY
  - DOMAIN-SUFFIX,gstatic.com,PROXY
  - DOMAIN-SUFFIX,googleusercontent.com,PROXY
